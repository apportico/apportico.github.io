<!doctype html>
<html lang="zh-Hant" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨林園藝支援</title><style>body{background:#f5eedb;color:#213b2e;font:17px/1.6 system-ui;margin:3rem auto;padding:0 1.25rem;max-width:40rem}a{color:#245f4c}</style></head><body><main><h1>雨林園藝支援</h1><h2>如何玩</h2><p>點擊一個槽或分水器來轉動它,然後點擊讓雨下。 分水器會在兩個開口之間交替。 小滴標示下一滴會掉在哪裡。 給每個罐子準確的滴數。</p><h2>恢復完整遊戲</h2><p>打開遊戲中的設定，點擊恢復購買。 使用購買解鎖的Apple帳戶。 全遊戲會在12個免費花園中加入100個花園。</p><h2>聯絡人</h2><p>联系支持时,请提供您的应用程序版本、设备型號以及发生了什么事。</p><p><a href="mailto:daniele@duck.com?subject=Rain%20Garden%20support" dir="ltr">daniele@duck.com</a></p><p><a href="privacy.html">隐私政策的变更</a></p></main></body></html>
