<!doctype html>
<html lang="zh-Hans" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨花园支持</title><style>body{background:#f5eedb;color:#213b2e;font:17px/1.6 system-ui;margin:3rem auto;padding:0 1.25rem;max-width:40rem}a{color:#245f4c}</style></head><body><main><h1>雨花园支持</h1><h2>如何玩</h2><p>点击一个水槽或分水器来转动它,然后点击让雨下。 分水器会在两个开口之间交替。 小滴标记着下一滴会落在哪里。</p><h2>恢复完整游戏</h2><p>打开游戏中的设置,点击恢复购买内容。 使用购买解锁的Apple帐户。 完整游戏将在12个免费花园中添加100个花园。</p><h2>联系人</h2><p>联系支持时,请包括您的应用程序版本、设备型号和发生的情况。</p><p><a href="mailto:daniele@duck.com?subject=Rain%20Garden%20support" dir="ltr">daniele@duck.com</a></p><p><a href="privacy.html">隐私政策的变更</a></p></main></body></html>
