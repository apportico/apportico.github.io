<h1>Lanternfall 隐私</h1>
<p>Apportico 不会从 Lanternfall 收集任何数据。本游戏没有分析、没有广告、没有账户，也没有自己的服务器。</p>
<h2>在你的 iPhone 上</h2>
<p>游戏会将你的设置和进度保存在本地设备上。</p>
<h2>Apple 服务</h2>
<p>完整版的付款和购买恢复由 Apple 处理。请参阅 <a href="https://www.apple.com/legal/privacy/">Apple 的隐私政策</a>。</p>
