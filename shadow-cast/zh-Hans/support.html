  <h1>支持</h1>
  <p lang="en">Shadow Cast</p>
  <h2>怎么玩</h2>
  <p>在长凳上拖动一块，观察它的影子移动。使用弯曲箭头旋转选定的部分。点击提示按钮即可查看该作品所属的位置。当灯轨上出现黄铜标记时，将灯滑至该标记处。</p>
  <h2>恢复完整游戏</h2>
  <p>点击拼图计数器并在完整游戏部分中选择“恢复购买”。使用最初购买游戏的 Apple 帐户。在 12 个免费拼图之后，一次购买可解锁 100 个拼图。</p>
  <h2>联系方式</h2>
  <p>向支持人员发送电子邮件时，请注明您的应用程序版本、iPhone 型号以及发生的情况。</p>
  <p><a href="mailto:daniele@duck.com?subject=Shadow%20Cast%20support">电子邮件支持</a></p>
  <p><a href="privacy.html">隐私政策</a></p>
