  <h1>支援</h1>
  <p lang="en">Shadow Cast</p>
  <h2>怎麼玩</h2>
  <p>在長凳上拖曳一塊，觀察它的影子移動。使用彎曲箭頭旋轉選定的部分。點擊提示按鈕即可查看該作品所屬的位置。當燈軌上出現黃銅標記時，將燈滑至該標記處。</p>
  <h2>恢復完整遊戲</h2>
  <p>點擊拼圖計數器並在完整遊戲部分中選擇「恢復購買」。使用最初購買遊戲的 Apple 帳戶。在 12 個免費拼圖之後，一次購買可解鎖 100 個拼圖。</p>
  <h2>聯絡方式</h2>
  <p>向支援人員發送電子郵件時，請註明您的應用程式版本、iPhone 型號以及發生的情況。</p>
  <p><a href="mailto:daniele@duck.com?subject=Shadow%20Cast%20support">電子郵件支援</a></p>
