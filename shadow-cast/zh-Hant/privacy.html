  <h1>隱私權政策</h1>
  <p lang="en">Shadow Cast</p>
  <p><a href="https://www.apple.com/legal/privacy/data/en/game-center/">Game Center</a> 為選用功能。使用時，Shadow Cast 會將你的成就進度與已解開的免費謎題數量傳送給 Apple。</p>
  <p>您的拼圖進度和聲音偏好都儲存在您的裝置上。該應用程式沒有帳戶、廣告、分析或追蹤。該應用程式不會將個人資料發送至 Apporico。</p>
  <p>Apple 負責處理購買和恢復。 StoreKit 告訴應用程式整個遊戲是否已解鎖。 Apporico 未收到您的付款詳細資訊。 <a href="https://www.apple.com/legal/privacy/">蘋果隱私權政策</a></p>
  <p>如果您向支援人員發送電子郵件，我們將使用您發送的資訊來回覆您。</p>
  <p><a href="support.html">支援</a></p>
