  <h1>プライバシーポリシー</h1>
  <p lang="en">Shadow Cast</p>
  <p>パズルの進行状況とサウンドの好みはデバイスに保存されます。アプリにはアカウント、広告、分析、追跡はありません。アプリは個人データを Apportico に送信しません。</p>
  <p>Apple が購入と復元を処理します。 StoreKit は、ゲーム全体がロック解除されているかどうかをアプリに通知します。 Apportico はあなたの支払いの詳細を受け取りません。 <a href="https://www.apple.com/legal/privacy/">Appleのプライバシーポリシー</a></p>
  <p>サポートに電子メールを送信した場合、送信された情報を使用して回答します。</p>
  <p><a href="support.html">サポート</a></p>
