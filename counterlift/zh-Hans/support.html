<!doctype html>
<html lang="zh-Hans" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>反升支援</title><style>body{background:#f7f7f2;color:#243149;font:17px/1.6 system-ui;margin:3rem auto;padding:0 1.25rem;max-width:40rem}a{color:#21585a}</style></head><body><main><h1>反升支援</h1><h2>如何玩</h2><p>当一个电梯上升时,另一个电梯下降。 您需要在乘客的电梯旁边接乘客,然后在他们的目的地让他们下车。用目标步数解开谜题即可获得三颗星。</p><h2>恢复完整游戏</h2><p>打开游戏内的“设置”，然后轻点“恢复购买”。请使用购买时的同一个 Apple 账户。解锁后可畅玩另外 108 个关卡。</p><h2>联系人</h2><p>联系支持时,请包括应用程序版本、设备型号和发生的情况。</p><p><a href="mailto:daniele@duck.com?subject=Counterlift%20support" dir="ltr">daniele@duck.com</a></p><p><a href="privacy.html">隐私政策的变更</a></p></main></body></html>
