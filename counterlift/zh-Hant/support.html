<html lang="zh-Hant" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>反升支援</title><style>body{background:#faf1e2;color:#243149;font:17px/1.6 system-ui;margin:3rem auto;padding:0 1.25rem;max-width:40rem}a{color:#21585a}</style></head><body><main><h1>反升支援</h1><h2>如何玩</h2><p>当一台电梯上升时，另一台电梯下降。在乘客的电梯旁边接乘客，然后在他们的目的地让他们下车。移动目标是可选的。</p><h2>恢復完整遊戲</h2><p>打開遊戲中的設定，點擊恢復購買。 使用你用來購買解鎖的同一個蘋果帳戶。 解鎖包括 100 個額外的關卡。</p><h2>聯絡人</h2><p>联系支持时,请提供应用程序版本、设备型號和发生的情况。</p><p><a href="mailto:daniele@duck.com?subject=Counterlift%20support" dir="ltr">daniele@duck.com</a></p><p><a href="privacy.html">隐私政策</a></p></main></body></html>
