<h1>夜間信号プライバシーポリシー</h1>
<p>Night Sign は、パズルの進行状況とサウンド設定をデバイスに保存します。ゲームにはアカウント、広告、分析、追跡がなく、個人データは送信されません。</p>
<p>Apple が購入と復元を処理します。 StoreKit は、フルゲームがロック解除されているかどうかをアプリに伝えます。私たちはあなたの支払いの詳細を受け取りません。参照<a href="https://www.apple.com/legal/privacy/">Appleのプライバシーポリシー</a>詳細については。</p>
<p>サポートにお問い合わせいただく場合、当社は送信された情報を使用して対応します。</p>
