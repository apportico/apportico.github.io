<h1>夜間信號支持</h1>
<h2>怎麼玩</h2>
<p>點擊鐵路道岔即可更改路線。 引導每列火車到自己的車站。 當兩列火車共用一個鐵路道口時，給它們不同的道口時間。 時刻表顯示每列火車何時到達每個交叉口。 點擊“出發”來運行計劃。 調整計劃使火車返回起點並保留您的路線和出發設定。</p>
<h2>恢復完整遊戲</h2>
<p>點擊級別計數器並滾動到“恢復購買”。使用購買完整遊戲的同一個 Apple 帳戶。購買後在 12 個免費拼圖的基礎上又增加了 100 個拼圖。</p>
<h2>聯絡方式</h2>
<p>電子郵件 <a href="mailto:daniele@duck.com?subject=Night%20Signal%20support">夜間信號支持</a> 您的應用版本、裝置型號以及發生的情況。</p>
