<h1>夜間訊號隱私權政策</h1>
<p>夜間訊號將您的謎題進度和聲音偏好儲存在您的裝置上。該遊戲沒有帳戶、廣告、分析或跟踪，也不會向我們發送個人資料。</p>
<p>Apple 負責處理購買和恢復。 StoreKit 告訴應用程式完整遊戲是否已解鎖。我們沒有收到您的付款詳細資訊。參見<a href="https://www.apple.com/legal/privacy/">蘋果的隱私權政策</a>了解更多。</p>
<p>如果您聯絡支援人員，我們將使用您傳送的資訊回覆。</p>
