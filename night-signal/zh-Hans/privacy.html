<h1>夜间信号隐私政策</h1>
<p>夜间信号将您的谜题进度和声音偏好存储在您的设备上。该游戏没有帐户、广告、分析或跟踪，也不会向我们发送个人数据。</p>
<p>Apple 负责处理购买和恢复。 StoreKit 告诉应用程序完整游戏是否已解锁。我们没有收到您的付款详细信息。参见<a href="https://www.apple.com/legal/privacy/">苹果的隐私政策</a>了解更多信息。</p>
<p>你可以选择是否使用 <a href="https://www.apple.com/legal/privacy/data/en/game-center/">Game Center</a>。使用时，Night Signal 会将你的成就进度发送给 Apple。</p>
<p>如果您联系支持人员，我们将使用您发送的信息进行回复。</p>
<p><a href="support.html">支持</a></p>
