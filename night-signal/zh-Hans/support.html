<h1>夜间信号支持</h1>
<h2>怎么玩</h2>
<p>点击铁路道岔即可更改路线。 引导每列火车到自己的车站。 当两列火车共用一个铁路道口时，给它们不同的道口时间。 时刻表显示每列火车何时到达每个交叉口。 点击“出发”来运行计划。 调整计划使火车返回起点并保留您的路线和出发设置。</p>
<h2>恢复完整游戏</h2>
<p>点击级别计数器并滚动到“恢复购买”。使用购买完整游戏的同一个 Apple 帐户。购买后在 12 个免费拼图的基础上又增加了 100 个拼图。</p>
<h2>联系方式</h2>
