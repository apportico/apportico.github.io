<h1>夜间信号支持</h1>
<h2>怎么玩</h2>
<p>点击开关即可更改路线。每列火车都需要到达自己的车站。当多趟火车使用道口时，请使用时刻表让它们以不同的节拍通过。点击“出发”来运行您的计划。如果失败，调整计划会将列车返回到起点，并保留您的换乘和时间选择。</p>
<h2>恢复完整游戏</h2>
<p>点击级别计数器并滚动到“恢复购买”。使用购买完整游戏的同一个 Apple 帐户。购买后在 12 个免费拼图的基础上又增加了 100 个拼图。</p>
<h2>联系方式</h2>
<p>电子邮件<a href="mailto:daniele@duck.com?subject=Night%20Signal%20support">夜间信号支持</a>您的应用版本、设备型号以及发生的情况。</p>
