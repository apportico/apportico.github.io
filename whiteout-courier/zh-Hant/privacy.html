<h1>隱私權 · Whiteout Courier</h1>
<h2>開發者</h2>
<p>Apportico 不會分析這款遊戲的使用情況或刊登廣告，也不營運帳號或遊戲伺服器。</p>
<h2>在這部裝置上</h2>
<p>Whiteout Courier 會把競速成績、無盡模式距離、設定和尚未傳送的成績儲存在你的裝置上。</p>
<h2>Apple 服務</h2>
<p>競速之旅的購買由 Apple 處理。如果你使用 Game Center，Apple 會接收你的競速成績和成就進度，並依照你的 Game Center 設定分享排行榜名次。</p>
